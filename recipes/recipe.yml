name: mkblue-laptop
description: ha

base-image: ghcr.io/secureblue/kinoite-main-hardened
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /
        
  - type: rpm-ostree
    install:
      - zsh
      - neovim
      - easyeffects
      - solaar
      
  - type: default-flatpaks
    notify: true
    scope: user
    install:
        - com.discordapp.Discord
        - org.signal.Signal
        - org.videolan.VLC
        - org.fedoraproject.MediaWriter
        - org.onlyoffice.desktopeditors
        - io.github.shiftey.Desktop
        - org.qbittorrent.qBittorrent
      
  - type: script
    scripts:
      - chromium-laptop.sh
      
  - type: signing
